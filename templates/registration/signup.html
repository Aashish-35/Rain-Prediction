{% extends "base.html" %}
{% block title %}Sign up · Rain Predictor{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass-card auth-card">
    <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
    <h3 class="text-center mb-1">Create your account</h3>
    <p class="text-center text-muted mb-4">Save every prediction to your history</p>
    <form method="post">
      {% csrf_token %}
      {% include "_form.html" %}
      <button type="submit" class="btn btn-gradient w-100 mt-2">Sign up</button>
    </form>
    <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
