{% extends "base.html" %}
{% block title %}Login · Rain Predictor{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass-card auth-card">
    <div class="auth-icon"><i class="bi bi-cloud-sun"></i></div>
    <h3 class="text-center mb-1">Welcome back</h3>
    <p class="text-center text-muted mb-4">Log in to predict the weather</p>
    <form method="post" data-loading>
      {% csrf_token %}
      {% include "_form.html" %}
      <button type="submit" class="btn btn-gradient w-100 mt-2">Login</button>
    </form>
    <p class="text-center text-muted mt-4 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
