{% for e in form.non_field_errors %}
  <div class="alert alert-danger py-2">{{ e }}</div>
{% endfor %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text small">{{ field.help_text|safe }}</div>{% endif %}
    {% for e in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle me-1"></i>{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
